name: Metrics Tests

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".metricsignore"
      - "features/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".metricsignore"
      - "features/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install metrics test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify metrics behavior
        run: pnpm run test:metrics
