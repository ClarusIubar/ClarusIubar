name: GitHub Metrics

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Generate profile metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          LANGUAGE_PRIVATE_EXCLUDED_REPOSITORIES: ${{ secrets.LANGUAGE_PRIVATE_EXCLUDED_REPOSITORIES }}
        run: node scripts/run-metrics.mjs

      - name: Update README asset cache keys
        run: node scripts/update-readme-cache-bust.mjs

      - name: Publish generated metrics through a pull request
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/publish-generated-metrics.mjs
