name: GitHub Metrics

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install metrics test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify metrics behavior
        run: pnpm run test:metrics

      - name: Generate profile metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          LANGUAGE_PRIVATE_EXCLUDED_REPOSITORIES: ${{ secrets.LANGUAGE_PRIVATE_EXCLUDED_REPOSITORIES }}
        run: node scripts/run-metrics.mjs

      - name: Update README asset cache keys
        run: node scripts/update-readme-cache-bust.mjs

      - name: Commit generated assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile metrics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
