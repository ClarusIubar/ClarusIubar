name: GitHub Metrics

on:
  schedule:
    - cron: "0 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_RUNTIME_TOKEN: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate language metrics card
        env:
          GITHUB_TOKEN: ${{ env.METRICS_RUNTIME_TOKEN }}
          PROFILE_USERNAME: ClarusIubar
        run: node scripts/render-language-metrics.mjs

      - name: Generate contribution density assets
        env:
          GITHUB_TOKEN: ${{ env.METRICS_RUNTIME_TOKEN }}
          PROFILE_USERNAME: ClarusIubar
        run: node scripts/render-contribution-density.mjs

      - name: Update README asset cache keys
        run: node scripts/update-readme-cache-bust.mjs

      - name: Commit generated assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile metrics"
          git pull --rebase origin main
          git push
