name: GitHub Metrics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_RUNTIME_TOKEN: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate language metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_RUNTIME_TOKEN }}
          user: ClarusIubar
          filename: metrics/metrics.languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 15
          plugin_languages_other: yes
          plugin_languages_colors: classic
          plugin_languages_indepth: yes
          plugin_languages_categories: programming
          config_timezone: Asia/Seoul

      - name: Commit generated assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile metrics"
          git push
