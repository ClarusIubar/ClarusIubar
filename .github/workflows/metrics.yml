name: GitHub Metrics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_RUNTIME_TOKEN: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate core metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_RUNTIME_TOKEN }}
          user: ClarusIubar
          filename: metrics/metrics.core.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Seoul

      - name: Generate activity metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_RUNTIME_TOKEN }}
          user: ClarusIubar
          filename: metrics/metrics.activity.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 15
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_activity: yes
          config_timezone: Asia/Seoul

      - name: Generate calendar metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_RUNTIME_TOKEN }}
          user: ClarusIubar
          filename: metrics/metrics.calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Seoul

      - name: Commit generated assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile metrics"
          git push
